# A lib (`src/lib.rs`) não sabe nada de 'rede', 'thread', 'container',
# 'tempo real', 'usuários' — só de 'planta', 'estado', 'entradas', 'saídas',
# 'parâmetros', 'edos', 'integração'.
#
# O binário `tep-plant` (`src/bin/tep_plant.rs`) é a aplicação de verdade:
# monta a Simulation, declara sensores/atuadores e configura o OPC-UA — por
# isso `simulation_framework` com a feature `opcua` é dependência normal do
# pacote (usada só pelo binário, não pela lib). Não precisa de `tokio`
# direto: `Simulation::run_model()` cria e possui o runtime tokio por
# dentro — o binário nunca vê `async`/`.await`.
#
# TEMPORÁRIO: simulation_framework aponta pra path local, não pro `git` de
# origem — precisa enxergar Sensor/IoImage/Simulation::add_sensor/IoImage/
# opcua_adapter/snapshot (o carregador genérico de condição inicial, seção
# 11.9 do plano), que ainda não foram commitados/enviados ao repositório
# remoto. Reverter pra `git = "...", branch = "..."` assim que esse trabalho
# for publicado — senão qualquer consumidor que misture os dois (path aqui,
# git em outro lugar da árvore) acaba com duas versões incompatíveis de
# StateRegistry no grafo de dependências.
#
# serde/toml saíram daqui — não sabe mais parsear TOML sozinho, é o
# simulation_framework::snapshot::Snapshot que faz isso agora (genérico,
# não específico do TEP).

[package]
name = "tennessee_eastman_process"
version = "0.1.0"
edition = "2021"

[lib]
name = "tennessee_eastman_process"
path = "src/lib.rs"

[[bin]]
name = "tep-plant"
path = "src/bin/tep_plant.rs"

[dependencies]
simulation_framework = { path = "../simulation-framework", features = ["opcua"] }
