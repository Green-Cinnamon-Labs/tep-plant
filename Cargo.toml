# A lib (`src/lib.rs`) não sabe nada de 'rede', 'thread', 'container',
# 'tempo real', 'usuários' — só de 'planta', 'estado', 'entradas', 'saídas',
# 'parâmetros', 'edos', 'integração'.
#
# O binário `tep-plant` (`src/bin/tep_plant.rs`) monta a Simulation.
#
# NOTA (2026-07-30): feature `opcua` do monjolo desligada por enquanto — a
# camada de descoberta/exposição externa (adaptador de rede) está sendo
# redesenhada. `Valve`/`Agitator` (física específica do TEP, `impl Actuator`
# direto) moram aqui (src/actuator.rs). `Sensor` (com `SensorBehavior`/
# `Noisy`/`Hysteresis` — genérico, sem nada de TEP) mora em `monjolo`
# (`monjolo::sensor::model`), reaproveitável por qualquer planta.
#
# TEMPORÁRIO: monjolo aponta pra path local, não pro `git` de origem.
#
# serde/toml saíram daqui — não sabe mais parsear TOML sozinho, é o
# monjolo::snapshot::Snapshot que faz isso agora (genérico,
# não específico do TEP).

[package]
name = "tennessee_eastman_process"
version = "0.1.0"
edition = "2021"

[lib]
name = "tennessee_eastman_process"
path = "src/lib.rs"

[[bin]]
name = "tep-plant"
path = "src/bin/tep_plant.rs"

[dependencies]
monjolo = { path = "../monjolo" }
