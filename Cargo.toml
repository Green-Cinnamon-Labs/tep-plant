# A lib (`src/lib.rs`) não sabe nada de 'rede', 'thread', 'container',
# 'tempo real', 'usuários' — só de 'planta', 'estado', 'entradas', 'saídas',
# 'parâmetros', 'edos', 'integração'.
#
# O binário `tep-plant` (`src/main.rs` — layout padrão de crate com 1 lib + 1 bin; `[[bin]]` abaixo
# só existe porque o nome do binário, "tep-plant", difere do nome do pacote/lib) monta a Simulation.
#
# NOTA (2026-08-15): feature `opcua` ligada de novo (default OFF, `--features opcua` liga) — o
# adaptador de rede (monjolo::adapter::opcua) expõe os catálogos de Sensor/Actuator já existentes em
# StateRegistry. Atuadores concretos do TEP (`FeedD` etc., `#[actuator(...)]`) moram em
# src/actuators/, um arquivo por atuador — não mais `src/actuator.rs`/structs à mão. `Sensor` (com
# `SensorBehavior`/`Noisy` — genérico, sem nada de TEP) mora em `monjolo` (`monjolo::sensor::model`),
# reaproveitável por qualquer planta.
#
# TEMPORÁRIO: monjolo aponta pra path local, não pro `git` de origem.
#
# serde/toml saíram daqui — não sabe mais parsear TOML sozinho, é o
# monjolo::snapshot::Snapshot que faz isso agora (genérico,
# não específico do TEP).

[package]
name = "tennessee_eastman_process"
version = "0.1.0"
edition = "2021"

[lib]
name = "tennessee_eastman_process"
path = "src/lib.rs"

[[bin]]
name = "tep-plant"
path = "src/main.rs"

[dependencies]
# `chemistry`: sempre ligada, não espelhada como feature própria (ao contrário de `opcua` abaixo) —
# entalpia/Antoine/densidade (monjolo::chemistry) são física que o TEP precisa incondicionalmente
# pra existir, não uma capacidade opcional que quem roda o binário possa querer desligar.
monjolo = { path = "../monjolo", features = ["chemistry"] }

[features]
# Espelha a feature `opcua` de monjolo — mesma filosofia (async-opcua + tokio pesados demais pra
# serem dependência default). `cargo run --bin tep-plant --features opcua` liga o adaptador.
opcua = ["monjolo/opcua"]
